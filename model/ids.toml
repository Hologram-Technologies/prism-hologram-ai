# model/ids.toml --- the conformance ID register.
#
# Every ID this repository claims, in one place, so that nothing is referenced
# without being defined. `CONFORMANCE.md` is generated from this file. A test
# whose name ends in an ID not listed here fails `check-model`, and an ID listed
# here with no scenario and no test fails it too (CM-02).
#
# `level` is the honesty level (R2):
#   some-true  a fact reproduced from an authority; not established here
#   build      constructed here and validated against its oracle
#   open       measured and reported, never asserted
#
# Every row here has a scenario in `features/suites/` and a test whose name ends
# in the ID, lowercased with underscores (R3, CM-02). There is no "pending"
# state: a capability that is not built does not get a row, and every row in this
# file is built.
#
# The `KN` rows are the decisions of the Hologram AI kernel in `app/`, numbered
# as the kernel numbers them: the number is the first byte of a request.
# A capability starts with a row here; `just new-capability` writes the row,
# its scenario and its failing test in the order `AGENTS.md` sets out.

spec = "template/1"

[[id]]
id = "KN-05"
level = "build"
suite = "kernel"
statement = "A buffer is admitted exactly when its expected and observed labels are equal and its declared and observed lengths are equal"

[[id]]
id = "KN-06"
level = "build"
suite = "kernel"
statement = "A tensor byte range is accepted exactly when it starts at or after the previous tensor end and ends within the file"

[[id]]
id = "KN-08"
level = "build"
suite = "kernel"
statement = "The decode bucket is at least what is needed, never above the maximum, and never below the current bucket"

[[id]]
id = "KN-09"
level = "build"
suite = "kernel"
statement = "A turn token budget never exceeds the context that remains and never exceeds the request"

[[id]]
id = "KN-02"
level = "build"
suite = "kernel"
statement = "A model is supported or derived exactly when no required key is missing, no unsupported feature is flagged and the manifest fits, and only then may weights download"

[[id]]
id = "KN-04"
level = "build"
suite = "kernel"
statement = "The quantisation tier chosen fits in memory whenever any tier does, and more memory never lowers it"

[[id]]
id = "KN-11"
level = "build"
suite = "kernel"
statement = "A requested dimension is bound exactly when it lies within its bounds, to a size at least the request and never above the upper bound"

[[id]]
id = "KN-07"
level = "build"
suite = "kernel"
statement = "A proposed trim is accepted exactly when what remains fits the context and restoring the newest dropped pair would not"

[[id]]
id = "KN-03"
level = "build"
suite = "kernel"
statement = "A proposed stage plan is accepted exactly when its stage fits the memory budget, is the largest that does, and its stages cover every layer once"

[[id]]
id = "KN-01"
level = "build"
suite = "kernel"
statement = "Each working state is entered from exactly one state by exactly one event, failed is left only by reset, and every other step is refused"

[[id]]
id = "EN-01"
level = "build"
suite = "engine"
statement = "The kernel client writes each request exactly as the kernel examples have it and reads every answer the kernel gives"

[[id]]
id = "EN-02"
level = "build"
suite = "engine"
statement = "A safetensors header is read into its tensors in file order, with every tensor byte range accepted by the kernel"

[[id]]
id = "EN-03"
level = "build"
suite = "engine"
statement = "A model config is read into the preflight question: a named family is recognised, every missing required key is counted, and an unsupported activation is flagged"
