level = "build"
suite = "kernel"
statement = "RMS norm is defined in LexLean, not Rust: Engine.Stage.RmsNorm::run reads values and weights as signed 64-bit integers in units of 2^-16, takes r, the largest integer with count r^2 at most (the sum of squares plus count epsilon) 2^32, by the digit-by-digit integer root (KN-43), and writes each value times its weight times 2^16 over r, rounded half to even (KN-44), refusing a row whose root is 0; Lean proves run gives two words a value, and evaluates roots and rows that the kernel test replays through crates/exact's integer_root and rms_norm"

[[id]]
id = "GP-56"
level = "build"
suite = "gpu"
statement = "On a cross-origin-isolated page the integer engine's products run on WebGPU: the worker that runs the model hands each q4 product to a WebGPU worker, which runs it with the quantiser, group-sum, accumulator and rounding kernels the verified kernel's guest prints (decision 48), every value a u32 word, and the dense output head with the dense kernel (KN-95) when its half weights fit one binding, any other product on an instance of the same engine.wasm; WebGPU is usable, and offered to decision 22, only where the page is isolated and the guest prints the group-sum kernel for every width the model's products read; the float engine no longer runs an ONNX export; and the tokens on WebGPU, asked for by name and chosen by the kernel, are the reference's and the CPU's"

[[id]]
