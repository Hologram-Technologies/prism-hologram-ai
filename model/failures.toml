crate = "onnx-preflight"
type = "OnnxError"
variant = "NumberTooLong"
suite = "engine"
condition = "A variable-length number does not end within the ten bytes that carry sixty-four bits"

[[failure]]
id = "FL-10"
crate = "onnx-preflight"
type = "OnnxError"
variant = "UnknownEncoding"
suite = "engine"
condition = "A field says it is encoded a way the format does not define, so its end cannot be found"

[[failure]]
id = "FL-11"
crate = "onnx-preflight"
type = "OnnxError"
variant = "NameNotText"
