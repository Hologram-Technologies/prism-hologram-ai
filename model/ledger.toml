[[claim]]
id = "AUTH-UOR-MATMUL"
level = "some-true"
statement = "uor-matmul 0.1.0 returns the sum of products of two sequences of integers exactly (dot_ref, over i8 and i16), decodes a Grid code through its table, and its Offset codec subtracts a zero point within a checked bound; its Complete register adds a magnitude times a power of two with every bit kept. EN-34, EN-37 and EN-40 check the sums against sums written out independently; the other claims of the library are not established here."
authority = "UOR-MATMUL"

[[claim]]
id = "OPEN-GREEDY-QWEN3-0.6B-INTEGER"
level = "open"
statement = "Greedy agreement of the integer CPU path (EN-49, hologram-ai-cpu-decode) with the float model on Qwen3-0.6B (onnx-community/Qwen3-0.6B-ONNX@79346d3, model_q4f16.onnx, BLAKE3 cd4068615928006d...), against ONNX Runtime 1.26.0 on the CPU running the same file: three chat prompts in Qwen3's template with thinking off, greedy to 32 tokens or the end of turn, 62 tokens in all. Teacher-forced on the integer path's tokens, the float model's argmax equals the integer path's at 62 of 62 positions; run freely, the two greedy sequences are equal for all 10, 20 and 32 tokens. Largest absolute logit gap 0.051, median per position about 0.03, which includes the float model's own half-precision activations. The integer path ran at about 1.2 s per token on one thread, release build, WSL. Measured 2026-11-18."
sample_size = 62

[[claim]]
id = "OPEN-GREEDY-QWEN2.5-1.5B-INTEGER"
level = "open"
statement = "Greedy agreement of the integer CPU path (EN-50, hologram-ai-cpu-decode) with the float model on Qwen2.5-1.5B-Instruct (onnx-community/Qwen2.5-1.5B-Instruct@d54957e, model_q4f16.onnx, BLAKE3 dc08a4e343b66d5e..., the decomposed export with query, key and value biases), against ONNX Runtime 1.26.0 on the CPU running the same file with graph optimisation off (its layer-norm fusion fails on this export): three chat prompts in Qwen2.5's template with its default system line, greedy to 32 tokens or the end of turn, 55 tokens in all. Teacher-forced on the integer path's tokens, the float model's argmax equals the integer path's at 54 of 55 positions; the one difference is at a near tie, the float model's best two logits 0.026 apart, and there the free greedy runs part, after 28 equal tokens; the other two prompts' free runs are equal throughout (15 and 8 tokens). Largest absolute logit gap per prompt 0.22, 0.61 and 0.25, median per position 0.08 to 0.14, which includes the float model's half-precision activations through every layer of this export. About 2.3 s per token on one thread, release build, WSL. Measured 2026-11-18."
sample_size = 55

[[claim]]
id = "OPEN-GREEDY-LLAMA-3.2-1B-INTEGER"
level = "open"
statement = "Greedy agreement of the integer CPU path (EN-51, hologram-ai-cpu-decode) with the float model on Llama 3.2 1B Instruct (onnx-community/Llama-3.2-1B-Instruct-ONNX@82ac693, model_q4f16.onnx and its .onnx_data, BLAKE3 d665bbb2e72f7e78... and de125a4fd0dc534b...), with Llama 3 rotary scaling at factor 32, low 1, high 4, original 8192, the parameters this export's own cos and sin cache shows though its config.json names none (GPU-VERIFICATION.md), against ONNX Runtime 1.26.0 on the CPU running the same files with graph optimisation off: three chat prompts in Llama 3.2's template, greedy to 32 tokens or the end of turn, 69 tokens in all. Teacher-forced on the integer path's tokens, the float model's argmax equals the integer path's at 69 of 69 positions; run freely, the two greedy sequences are equal for all 8, 32 and 29 tokens. Largest absolute logit gap per prompt 0.36, 0.32 and 0.50, which includes the float model's half-precision activations and its half-precision rotary cache. About 1.9 s per token on one thread, release build, WSL. Measured 2026-11-18."
sample_size = 69

[[claim]]
id = "OPEN-SHARE-M2-FAMILIES"
level = "open"
statement = "Byte-identical tensors across the milestone's three text families, by BLAKE3 address and length, from the hub's UOR index (gethologram.ai/data/uor, hologram.hub.uor/v3, read 2026-11-19; computed from the index, no model downloaded): between any two of Qwen2.5-1.5B-Instruct (onnx-community@d54957e), Qwen3-0.6B (onnx-community/Qwen3-0.6B-ONNX@79346d3) and Llama 3.2 1B Instruct (onnx-community@82ac693), at q4 or q4f16, 0 tensors and 0 bytes. Between one model's q4 and q4f16 exports, all of them its 4-bit code tensors: Qwen2.5-1.5B 213 tensors, 655,098,136 bytes (53.7% of its q4f16 bytes); Qwen3-0.6B 196 tensors, 220,200,960 bytes (38.7%); Llama 3.2 1B 112 tensors, 486,539,264 bytes (44.7%). The six exports list 7,277,901,396 tensor bytes, 5,916,063,036 of them distinct (18.7% stored once). Each of Qwen2.5's exports lists 2,629 tensors under 559 distinct addresses."
sample_size = 6

[[claim]]
id = "OPEN-STORE-SECOND-PRECISION"
level = "open"
statement = "Bytes a second precision downloads when the first is held, by the page's rule (GP-31: tensors of 4,096 bytes or more kept apart by address, the rest of each file under the file's BLAKE3), computed from the same UOR index: Qwen2.5-1.5B q4 after q4f16 1,132,468,734 of 1,787,566,590 bytes (655,097,856 saved, 36.6%), q4f16 after q4 566,781,084 of 1,221,878,940 (53.6% saved); Qwen3-0.6B q4 after q4f16 698,895,625 of 919,096,585 (220,200,960 saved, 24.0%), q4f16 after q4 349,588,790 of 569,789,750 (38.6% saved); Llama 3.2 1B q4 after q4f16 1,206,281,848 of 1,692,821,112 (486,539,264 saved, 28.7%), q4f16 after q4 603,216,158 of 1,089,755,422 (44.6% saved). A second family saves nothing (OPEN-SHARE-M2-FAMILIES). The same file under a second repository downloads nothing, as the hermetic journey shows. Measured on Qwen3-0.6B: see OPEN-STORE-QWEN3-0.6B."
sample_size = 6

[[claim]]
id = "OPEN-STORE-QWEN3-0.6B"
level = "open"
statement = "onnx-community/Qwen3-0.6B-ONNX@79346d3 from the live hub, the page served locally, one fresh browser profile, 2026-11-19, Windows, headless Chromium on the SwiftShader WebGPU adapter (the machine's GPU does not start in the test browser), one run each. q4f16 cold: 206 s to ready, 578.9 MB from Hugging Face, 395 tensors downloaded in one read and kept; decision 28 ready, 508 of 508 addresses. q4 after it: 392 s, 699.1 MB from Hugging Face (the index predicts 698,895,625 bytes of tensors and rest; the page counted exactly that, 698,585,088 + 310,537), the 196 tensors q4f16 shares (220,200,960 bytes, 24.0% of the 919,096,585-byte file) read from the browser, the other 256 downloaded in 197 range reads. A cold q4 load was not run, so load time saved is not measured directly; the 197 reads ran at 1.8 MB/s against 2.8 MB/s for one read, so on this link the saving in bytes did not become a saving in time. Return visit with the network on: q4f16 ready in 6.3 s on WebGPU and 7.5 s on the CPU, 0 bytes downloaded, all 395 tensors read from the browser and admitted again. Prefix reuse with the same text twice (19 prompt ids, a 3-id head): identical tokens both times; time to first token 21.9 s then 14.2 s on SwiftShader and 15.4 s then 12.5 s on the float CPU engine, the first turn also paying one-time setup, so the gain of a 3-id head is not separable here. Not on the integer engine (PR 84 is not merged) and not on real GPU hardware."
sample_size = 1

