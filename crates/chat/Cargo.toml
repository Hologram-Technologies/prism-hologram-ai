[package]
name = "hologram-ai-chat"
description = "Keeps a conversation's state and its token arithmetic, and puts every question about them to the Hologram AI kernel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

# The kernel client to ask with, and the tokeniser to count with. A
# conversation that counted its own tokens some other way would be asking the
# kernel about tokens the model does not have.
[dependencies]
hologram-ai-kernel-client = { workspace = true }
hologram-ai-tokenizer = { workspace = true }

