[package]
name = "repo-conformance"
description = "The BDD runner and the honesty meta-gate. Dev and CI only; never a dependency of a shipped crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
repo-model = { workspace = true }

# The engine suite tests the shipped engine crates; they never depend on this one.
[dev-dependencies]
hologram-ai-chat = { workspace = true }
hologram-ai-download = { workspace = true }
hologram-ai-kernel-client = { workspace = true }
hologram-ai-model-reader = { workspace = true }
hologram-ai-onnx-preflight = { workspace = true }
hologram-ai-tokenizer = { workspace = true }
hologram-ai-wasm = { workspace = true }
# HuggingFace's own implementation, as the oracle for `EN-20` and nothing
# else: a dev-dependency of a crate that does not ship (R6), so what the engine
# carries is still only what this repository wrote.
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
serde_json = { workspace = true }

[lints]
workspace = true
