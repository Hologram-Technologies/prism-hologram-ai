[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Raise this when something here needs a newer compiler; nothing does yet.
rust-version = "1.89"
license = "MIT OR Apache-2.0"
# Instantiated repositories set their own URLs here.
repository = "https://github.com/Hologram-Technologies/prism-hologram-ai"
homepage = "https://github.com/Hologram-Technologies/prism-hologram-ai"
authors = ["UOR Foundation"]
keywords = []
categories = []

[workspace.dependencies]
repo-model = { version = "0.1.0", path = "crates/model" }
# A `path` dependency with no `version` is a wildcard requirement, and
# `cargo deny` refuses those (`wildcards = "deny"`). Every internal dependency
# carries both.
repo-conformance = { version = "0.1.0", path = "crates/conformance" }
# The engine. Its crates ship; they use only locked crates.io dependencies (R6).
hologram-ai-kernel-client = { version = "0.1.0", path = "crates/kernel-client" }
hologram-ai-model-reader = { version = "0.1.0", path = "crates/model-reader" }
hologram-ai-chat = { version = "0.1.0", path = "crates/chat" }
hologram-ai-download = { version = "0.1.0", path = "crates/download" }
hologram-ai-exact = { version = "0.1.0", path = "crates/exact" }
hologram-ai-cpu-decode = { version = "0.1.0", path = "crates/cpu-decode" }
hologram-ai-onnx-preflight = { version = "0.1.0", path = "crates/onnx-preflight" }
hologram-ai-tokenizer = { version = "0.1.0", path = "crates/tokenizer" }
hologram-ai-wasm = { version = "0.1.0", path = "crates/wasm" }
hologram-ai-cpu-encode = { version = "0.1.0", path = "crates/cpu-encode" }
# The default features are kept on purpose: `std` is what lets the hash pick
# the vector instructions the machine actually has. Without it the portable
# path is used everywhere, which is slower on every host this runs on.
blake3 = "1.5"
fancy-regex = "0.14"
# The hash a weight container names its whole file by. Like BLAKE3 it is the
# authority's own implementation, cited in `model/authorities.toml` and checked
# here against the standard's own examples; it is not re-derived (R2).
sha2 = "0.10"
serde_json = "1.0"
# The Unicode tables the WordPiece tokeniser reads, the ones its authority
# reads (crates/tokenizer/Cargo.toml).
unicode_categories = "0.1.1"
unicode-normalization-alignments = "0.1.12"
# The UOR Foundation's exact matrix arithmetic, which the exact CPU products
# sum their groups with. Cited in `model/authorities.toml`; checked in the gate
# against a sum written out in `i64` (R2).
uor-matmul = "0.1.0"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
