[package]
name = "xtask"
description = "Repository gates (check-model, audit-limits, audit-deferral, audit-bootstrap, validate) and the new-capability and new-failure scaffolds."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# `repo-conformance` supplies the source reader `audit-limits` shares with the
# meta-gate, so the two gates read Rust the same way.
[dependencies]
repo-model = { workspace = true }
repo-conformance = { workspace = true }
serde_json = "1.0.151"
sha2 = "0.10.9"

[lints]
workspace = true
